    <body>

            <h1>Registration Form</h1>
    <label for="name"> Full Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="matric">Matric Number:</label>
            <input type="text" id="matric" name="matric" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="year">Year of Study:</label><br>
            <input type = "radio" id="year1" name="year" value="year1">
            <label for="year1">Year 1</label><br>
            <input type = "radio" id="year2" name="year" value="year2">
            <label for="year2">Year 2</label><br>
            <input type = "radio" id="year3" name="year" value="year3">
            <label for="year3">Year 3</label><br>
            <input type = "radio" id="year4" name="year" value="year4">
            <label for="year4">Year 4</label><br><br>

            <label for="Session">Pick Your Sessions (3 and above):</label><br>
            <input type="checkbox" id="session1" name="session" value="Ice-Breaking & Script-Reading">Ice-Breaking & Script-Reading<br>
            <input type="checkbox" id="session2" name="session" value="Audition">Audition<br>
            <input type="checkbox" id="session3" name="session" value="Bantai Sampai Lunyai">Bantai Sampai Lunyai<br>
            <input type="checkbox" id="session4" name="session" value="Closing & Feedback">Closing & Feedback<br><br>


            <label for="Programme">Programme of Faculty:</label><br>
            <select id="Programme" name="Programme">
                <option value="FSKM">FSKM</option>
                <option value="FSSM">FSSM</option>
                <option value="FTKK">FTKK</option>
                <option value="FSMA">FSMA</option>
                <option value="FSPA">FSPA</option>
                <option value="FPEPS">FPEPS</option>
                <option value="FPM">FPM</option>
            </select><br><br>

            <input type="submit" value="Register">
